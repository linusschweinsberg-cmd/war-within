function weekScore(S,D){
 const days=[];for(let d=D.week*7;d<S.day;d++)days.push((S.wlog||{})[S.season+'-'+d]||{});days.push(dayLive(S));

 const pace=clamp(D.wk/Math.max(1,D.plan*n/7),0,1),ps=sum('ps'),pr=ps?sum('pd')/ps:pace;
 const exec=Math.round(50*pace+20*pr),goal=Math.round(20*sum('g')/n),plan=Math.round(10*(sum('b')+sum('r')+sum('pq'))/(3*n));
 return{total:exec+goal+plan,exec,goal,plan,n}}
function briefCands(S,D){

 const base=S.comeback?cbList(S,D):ESS.map(id=>D.allM.find(m=>m.id===id));
 const gm=typeof goalMs==='function'?goalMs(S).filter(x=>weekLeft(S,x)>0).map(x=>D.allM.find(m=>m.id===x.m.id)):[];const seen=new Set(),out=[];[np,...gm,...base,...D.allM.filter(m=>m.freq==='daily'||m.freq==='multi')].forEach(m=>{if(m&&!isDone(S,m)&&!seen.has(m.id)){seen.add(m.id);out.push(m)}});return out}

const pad2=x=>String(x).padStart(2,'0');
function weekStory(st,prev,wk,best){const me=st.find(r=>r.id==='me'),L=st[0],gap=st[0].pts-(st[1]?st[1].pts:0),who=r=>r.id==='me'?'dir':r.name;
 const title=me.rank===1?(gap<=5?'Sieg in letzter Minute':'Deine Woche'):gap<=5?'Ein Herzschlag-Finale':L.name+' dominiert';
 const lines=[me.rank===1?`Du gewinnst Spielwoche ${wk} mit ${me.pts} Punkten${gap<=5&&st[1]?`, nur ${gap} vor ${st[1].name}`:''}.`:`${L.name} gewinnt Spielwoche ${wk} mit ${L.pts} Punkten${gap<=5&&st[1]?`, nur ${gap} vor ${who(st[1])}`:''}.`];
 const cl=prev?st.map(x=>({x,d:(prev[x.id]||x.rank)-x.rank})).sort((a,b)=>b.d-a.d)[0]:null;
 if(cl&&cl.d>0)lines.push(cl.x.id==='me'?`Du machst ${cl.d} ${cl.d===1?'Platz':'Plätze'} gut.`:`${cl.x.name} macht ${cl.d} ${cl.d===1?'Platz':'Plätze'} gut.`);
 else{const sp=st[0].pts-st[Math.min(2,st.length-1)].pts;lines.push(sp<=12?`Zwischen Platz 1 und 3 liegen nur ${sp} Punkte.`:`Zwischen Platz 1 und 3 liegen ${sp} Punkte.`)}
 if(me.rank>1){const ab=st[me.rank-2];lines.push(`Du landest auf Platz ${me.rank}, ${ab.pts-me.pts} Punkte hinter ${ab.name}. Stärkster Bereich: ${best}.`)}else lines.push(`Stärkster Bereich: ${best}.`);
 return{title,lines,rank:me.rank}}
function Finale({c,big}){const {S,D}=c;const n=new Date(c.now),mid=new Date(n);mid.setHours(24,0,0,0);const ms=Math.max(0,mid-n),h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),sec=Math.floor(ms%6e4/1e3);
 const st=D.standings,me=D.me,ab=st[me.rank-2],be=st[me.rank];

function calcBonus(k,v,S){
 if(k==='lift'){const e=epley(v.w,v.r),ver=S.stats.bench.ver,rel=(e-ver)/ver*100;return{bonus:clamp(Math.round(rel),0,20),label:`Qualität ${rel>=0?'+':''}${n1(rel)} % zur Baseline`}}
 if(k==='run'){const lp=S.stats.run5k.last/5,p=(v.mn*60+v.sc)/v.dk,rel=(lp-p)/lp*100;return{bonus:v.dk>=3?clamp(Math.round(rel*2),0,20):0,label:`Tempo ${rel>=0?'+':''}${n1(rel)} % vs. letzter 5 km`}}
 if(k==='focus')return{bonus:clamp(Math.round((v.min/60-1)*100),-50,20),label:`Dauer ${v.min} Min. (Ziel 60)`};
 if(k==='study'||k==='read')return{bonus:clamp(Math.round((v.min/20-1)*100),-50,20),label:`Dauer ${v.min} Min. (Ziel 20)`};
 if(k==='save')return{bonus:clamp(Math.round((v.amt/10-1)*100),-50,20),label:`Betrag ${eur(v.amt)} (Ziel €10)`};
 return{bonus:0,label:'Eintrag ohne Missionspunkte'}}
const LOGDEF={lift:{w:70,r:10,ver:false},squat:{w:90,r:5,ver:false},run:{dk:5,mn:23,sc:50},swim:{sd:100,mn:2,sc:4},pull:{reps:12},focus:{min:60},study:{min:20},read:{min:20},save:{amt:10}};

 const set=p=>setV(o=>({...o,...p}));
 const [q,setQ]=useState(75);
 const m=sh.mid?S.missions.find(x=>x.id===sh.mid):null;
 const {bonus,label}=calcBonus(k,v,S);
 const est=epley(v.w||0,v.r||1);
 const tot=(v.mn||0)*60+(v.sc||0);
 let body=null;
 if(k==='lift'||k==='squat'){const ver=k==='lift'?S.stats.bench.ver:S.stats.squat.ver;
  body=html`<${Step} label="Gewicht" v=${v.w} on=${x=>set({w:x})} step=${2.5} min=${20} max=${400} unit="kg" fmt=${x=>String(x).replace('.',',')}/><${Step} label="Wiederholungen" v=${v.r} on=${x=>set({r:x,ver:x===1?v.ver:false})} min=${1} max=${30}/>
  <div className="card2 p-3.5 mt-2"><div className="lbl">Geschätzter 1RM (Epley)</div><div className="num text-[28px] font-bold mt-1">${n1(est)} kg</div>
   <div className="text-[11.5px] mute mt-1.5 leading-relaxed">Verifizierter PR: <b className="num">${ver} kg</b>. Eine Schätzung ersetzt ihn nie automatisch.</div></div>
  ${v.r===1&&html`<button onClick=${()=>set({ver:!v.ver})} className="ghost w-full mt-2 p-3 flex items-center gap-3 text-left text-[12.5px]"><div className="w-5 h-5 rounded-md flex items-center justify-center" style=${{background:v.ver?'var(--acc)':'transparent',border:'1.5px solid var(--acc)'}}>${v.ver&&html`<${Icon} n="check" s=${13} sw=${3} cls="text-white"/>`}</div>Als verifizierten Rekordversuch melden (sauber, mit Zeugen oder Video)</button>`}`}
 if(k==='run')body=html`<${Step} label="Distanz" v=${v.dk} on=${x=>set({dk:x})} step=${.5} min=${.5} max=${60} unit="km" fmt=${x=>String(x).replace('.',',')}/><${Step} label="Minuten" v=${v.mn} on=${x=>set({mn:x})} min=${1} max=${600}/><${Step} label="Sekunden" v=${v.sc} on=${x=>set({sc:x})} step=${5} max=${55}/>

  <div className="col-span-2 text-[11.5px] mute">${v.dk===5?`5-km-Bestzeit: ${fmtT(S.stats.run5k.pr)}${tot<S.stats.run5k.pr?' — das wäre ein neuer Rekord!':''}`:'Nur 5-km-Läufe aktualisieren die 5-km-Statistik.'}</div></div>`;
 if(k==='swim')body=html`<${Step} label="Distanz" v=${v.sd} on=${x=>set({sd:x})} step=${50} min=${25} max=${5000} unit="m"/><${Step} label="Minuten" v=${v.mn} on=${x=>set({mn:x})} max=${180}/><${Step} label="Sekunden" v=${v.sc} on=${x=>set({sc:x})} max=${59}/>

 if(k==='pull')body=html`<${Step} label="Wiederholungen" v=${v.reps} on=${x=>set({reps:x})} min=${1} max=${100}/><div className="text-[11.5px] mute mt-2">Bisher: ${S.stats.pull.pr} Wiederholungen.</div>`;
 if(k==='focus'||k==='study'||k==='read')body=html`<${Step} label="Dauer" v=${v.min} on=${x=>set({min:x})} step=${k==='focus'?15:5} min=${5} max=${600} unit="Min."/><div className="card2 p-3.5 mt-2 text-[12.5px]"><span className="num font-bold">${n1(v.min/60)} h</span> werden ${k==='focus'?'deiner Fokuszeit':k==='study'?'deiner Lernzeit':'deiner Lesezeit'} hinzugefügt.${k==='study'?html` Gesamt: <b className="num">${n1(S.study.hours+v.min/60)} h</b>`:''}</div>`;
 if(k==='save')body=html`<${Step} label="Betrag" v=${v.amt} on=${x=>set({amt:x})} step=${5} min=${5} max=${5000} unit="€"/><div className="card2 p-3.5 mt-2 text-[12.5px]">Neu gespart: <b className="num">${eur(S.save.saved+v.amt)}</b> · Prognose Saisonende: <b className="num">${eur(S.save.saved+v.amt+S.save.weekly*(3-c.D.week))}</b></div>`;
 const pts=m?Math.round(m.pts*(1+bonus/100)):0;
 return html`<div><div className="flex items-start justify-between"><div><div className="lbl acc">${sh.rec?'Leistung erfassen':'Schnelleingabe'}</div><h2 className="text-xl font-bold mt-1">${LOGNAME[k]}</h2>${m&&html`<div className="text-xs mute mt-1">${m.title}</div>`}</div><button onClick=${c.closeSheet} className="ghost w-9 h-9 flex items-center justify-center"><${Icon} n="x" s=${16}/></button></div>
 <div className="mt-3">${body}</div>
 ${m&&html`<div className="flex items-center justify-between mt-3 text-[12px]"><span className="mute">${label}</span><span className="num font-bold acc">+${pts} Pkt.</span></div>`}
 ${m&&html`<div className="mt-4"><${QSlider} q=${q} setQ=${setQ} m=${m} c=${c}/></div>`}
 <button className="btn w-full py-3.5 mt-4 text-sm" onClick=${()=>c.logSave(k,v,sh.mid,false,m?q:undefined)}>${m?'Speichern & Mission abschließen':'Speichern'}</button>

  :html`<div className="text-[13px] mute leading-snug">Kein Ziel in diesem Bereich. Ohne Ziel bleibt die Säule eine Baustelle, und das ist in Ordnung, wenn du bewusst anderswo baust.</div><button onClick=${()=>c.openSheet({t:'goal',area})} className="chip mt-2">Ziel für ${a.de}</button>`}

  <button onClick=${()=>c.openSheet({t:'trules'})} className="bg-transparent border-0 p-0 mt-1.5 acc font-semibold text-[12.5px]">Bauregeln ansehen</button><//>

function goalMs(S){const L=S.life;if(!L)return[];const mg=mainGoal(S),mid=mg&&mg.id;
 return(L.actions||[]).filter(a=>!a.off&&(LC.goalById(L,a.goalId)||{}).status==='active').sort((a,b)=>(b.goalId===mid)-(a.goalId===mid)).map(a=>({a,m:S.missions.find(x=>x.id===a.missionId),g:LC.goalById(L,a.goalId)})).filter(x=>x.m)}

function MChart({g,ms,h=96}){const vs=ms.map(x=>x.v),t=g.metric.target;const all=t!=null?[...vs,t]:vs;let lo=Math.min(...all),hi=Math.max(...all);if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
 const W=300,X=i=>vs.length<2?W/2:8+i*(W-16)/(vs.length-1),Y=v=>h-6-(v-lo)/(hi-lo)*(h-12);const pts=vs.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
 return html`<svg viewBox=${`0 0 ${W} ${h}`} className="w-full block" style=${{height:h}} role="img" aria-label=${`Verlauf ${g.metric.name}: ${vs.length} Messwerte, zuletzt ${LC.fmtV(g.metric,vs[vs.length-1])}`}>
 ${t!=null&&html`<line x1="0" x2=${W} y1=${Y(t)} y2=${Y(t)} stroke="var(--good)" strokeDasharray="4 4" strokeWidth="1" opacity=".7"/><text x=${W-4} y=${Y(t)-4} textAnchor="end" fontSize="10" fill="var(--good)">Ziel ${LC.fmtV(g.metric,t)}</text>`}

/* ───── Wurzel: Anmeldung → Onboarding → App ───── */
function Root(){
 const [A,setA]=useState(loadAuth);const [ready,setReady]=useState(false);const [authError,setAuthError]=useState('');const [boot,setBoot]=useState({init:null,key:0});
 const set=useCallback(fn=>setA(p=>{const n={...p,...fn(p)};saveAuth(n);return n}),[]);
 useEffect(()=>{let active=true;
 const apply=({session,recovery})=>{if(!active)return;setBoot(b=>({init:null,key:b.key+1}));setA(p=>{const sameUser=session?session.id===(p.session?.id||p.obUserId):p.session?.mode==='guest';const next={...p,session:session||(p.session?.mode==='guest'?p.session:null),recovery:!!recovery,onboarded:session?!!localStorage.getItem(ACC_KEY+'_'+session.id):false,ob:sameUser?p.ob:null,obUserId:session&&sameUser&&p.ob?session.id:null};if(sameUser)next.onboarded=p.onboarded;saveAuth(next);return next});setReady(true)};
 const unsub=authApi.subscribe(apply);authApi.restore().then(apply).catch(e=>{if(active){setAuthError(e.message);setReady(true)}});return()=>{active=false;unsub()};},[]);
 const skey=A.session&&A.session.mode!=='guest'?ACC_KEY+'_'+A.session.id:GUEST_KEY;
 const theme=(()=>{try{const st=JSON.parse(localStorage.getItem(skey)||'{}');window.__wwSkin=st.skin||'antik';return st.theme||'dark'}catch(e){return'dark'}})();
 if(!ready)return html`<${Shell} theme=${theme}><div className="p-6">Anmeldung wird geladen …</div><//>`;
 if(A.recovery||!A.session)return html`<div>${authError&&html`<div role="status" className="p-3 text-sm">${authError}</div>`}<${AuthFlow} A=${A} set=${set} theme=${theme}/></div>`;
 const isG=A.session.mode==='guest';
 if(isG?A.guestOb:!A.onboarded)return html`<${Onboarding} A=${A} set=${set} theme=${theme} onDone=${ob=>{const s=buildState(ob,A.session);try{localStorage.setItem(skey,JSON.stringify(s))}catch(e){}setBoot(b=>({init:s,key:b.key+1}));set(()=>(isG?{guestOb:false,ob:null}:{onboarded:true,ob:null}))}}/>`;
 if(authError&&A.session)return html`<div role="alert">${authError}<button onClick=${()=>setAuthError('')}>Zurück</button></div>`;
 const auth={session:A.session,
  signOut:async()=>{try{if(!isG)await authApi.signOut()}catch(e){setAuthError(e.message);return}setBoot(b=>({init:null,key:b.key+1}));set(()=>({session:null}))},
  restartOnboarding:()=>set(p=>({...(isG?{guestOb:true}:{onboarded:false}),ob:newOb(isG?'':(p.session&&p.session.name)||'')})),
  rename:name=>set(p=>({session:{...p.session,name},account:p.account&&p.session&&p.session.mode==='demo'?{...p.account,name}:p.account})),
  wipe:async()=>{try{if(!isG)await authApi.signOut()}catch(e){setAuthError(e.message);return}try{[skey,AUTH_KEY].forEach(k=>localStorage.removeItem(k))}catch(e){}setBoot(b=>({init:null,key:b.key+1}));setA({session:null,account:null,onboarded:false,ob:null})}};
 return html`<${App} key=${skey+boot.key} skey=${skey} init=${boot.init} auth=${auth}/>`}
