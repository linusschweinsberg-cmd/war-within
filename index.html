function debriefPlan(S,D){const b=briefToday(S);const gm=goalMs(S);const ids=new Set();
 gm.forEach(x=>{if(S.done[x.m.id]||weekLeft(S,x)>0)ids.add(x.m.id)});(b?b.ids:[]).forEach(id=>{const m=D.allM.find(y=>y.id===id);if(m&&(S.done[id]||!isDone(S,m)))ids.add(id)});
 return[...ids].map(id=>D.allM.find(m=>m.id===id)).filter(m=>m&&m.id!=='m_ref')}
function Debrief({c}){const {S,D}=c;const L=S.life;const plan=useMemo(()=>debriefPlan(S,D),[]);const done=plan.filter(m=>S.done[m.id]),skipped=plan.filter(m=>!S.done[m.id]);
 const prev=(L.daily||[]).find(e=>e.d===L.d)||{};const [mood,setMood]=useState(prev.mood||null),[ob,setOb]=useState((prev.obst||[])[0]||null),[ch,setCh]=useState(prev.change||(skipped.length?null:'keep'));
 const areas=[...new Set(done.map(m=>{const x=goalMs(S).find(y=>y.m.id===m.id);return x&&x.g.area}).filter(Boolean))];const st=LC.templeState(S);
 const chips=(opts,val,set)=>html`<div className="flex flex-wrap gap-1.5">${opts.map(([k,l])=>html`<button key=${k} aria-pressed=${val===k} onClick=${()=>set(val===k?null:k)} className=${`chip ${val===k?'on':''}`} style=${{minHeight:38,padding:'8px 14px',fontSize:13}}>${l}</button>`)}</div>`;
 const save=()=>c.saveDebrief({mood,obst:ob?[ob]:[],change:ch,done:done.map(m=>m.id),skipped:skipped.map(m=>m.id),next:ch==='earlier'&&skipped[0]?skipped[0].id:null});
 return html`<${Sheet} sub=${'Daily Debrief · '+DAYS_L[D.di]} title="Dein Tag" onClose=${c.closeSheet}>
 <div className="card2 p-3.5 -mt-1"><div className="flex items-baseline justify-between"><span className="lbl">Automatisch ausgewertet</span><span className="num text-[14px] font-bold">${done.length} von ${plan.length}</span></div>
  <div className="mt-2 flex flex-col gap-1.5">${plan.map(m=>{const ok=!!S.done[m.id];return html`<div key=${m.id} className="flex items-center gap-2.5 text-[13.5px]"><span className="w-5 h-5 rounded-full flex items-center justify-center shrink-0" style=${{background:ok?'var(--done)':'transparent',boxShadow:ok?'none':'0 0 0 1.5px var(--mute) inset',color:'#fff'}}>${ok&&html`<${Icon} n="check" s=${12} sw=${3}/>`}</span><span className=${'flex-1 truncate '+(ok?'':'mute')}>${m.title}</span>${!ok&&html`<span className="text-[11.5px] mute">ausgelassen</span>`}</div>`})}${!plan.length&&html`<div className="text-[13px] mute">Heute war nichts geplant.</div>`}</div></div>
 ${areas.length>0&&html`<div className="flex items-center gap-3 mt-3"><span style=${{width:70}} className="shrink-0"><${TempleSVG} st=${st} sel=${areas[0]} mini=${true} anim=${false}/></span><div className="text-[13px] leading-snug">Heute gebaut an: <b>${areas.map(a=>LC.AREA[a].name).join(', ')}</b>. Jede umgesetzte Ziel-Handlung zählt für die konstante Woche deiner Säule.</div></div>`}
 <div className="text-[13.5px] font-semibold mt-4 mb-1.5">Wie lief dein Tag?</div>${chips(LC.MOODS,mood,setMood)}
 ${skipped.length?html`<div className="text-[13.5px] font-semibold mt-4 mb-1.5">Was hat dich aufgehalten?</div>${chips(LC.DEBRIEF_OBST,ob,setOb)}
  <div className="text-[13.5px] font-semibold mt-4 mb-1.5">Was möchtest du ändern?</div>${chips(LC.CHANGES,ch,setCh)}
  ${ch==='earlier'&&html`<div className="text-[12px] mute mt-1.5">„${skipped[0].title}“ steht morgen an erster Stelle.</div>`}${ch==='smaller'&&html`<div className="text-[12px] mute mt-1.5">${skipped.length===1?'Notiert. Im Wochenrückblick bekommst du eine kleinere Version als Experiment vorgeschlagen.':'Notiert. Wiederholt es sich, schlägt der Wochenrückblick eine kleinere Version vor.'} Dein Plan ändert sich nicht ungefragt.</div>`}`
 :plan.length?html`<div className="card2 p-3 mt-4 text-[13.5px] leading-snug"><b>Der Plan funktioniert.</b> Behalte ihn bei.</div>`:null}
 <button onClick=${save} disabled=${!mood} className="btn w-full py-3.5 mt-5 text-sm">Debrief abschließen</button>

function goalMs(S){const L=S.life;if(!L)return[];const mg=mainGoal(S),mid=mg&&mg.id;
 return(L.actions||[]).filter(a=>!a.off&&(LC.goalById(L,a.goalId)||{}).status==='active').sort((a,b)=>(b.goalId===mid)-(a.goalId===mid)).map(a=>({a,m:S.missions.find(x=>x.id===a.missionId),g:LC.goalById(L,a.goalId)})).filter(x=>x.m)}
const weekLeft=(S,x)=>{const L=S.life,wk=LC.curWk(L);return Math.max(0,LC.plannedAt(x.a,wk)-LC.doneIn(L,x.a.id,wk))};

const runningExp=(S,gid)=>((S.life&&S.life.exps)||[]).find(e=>e.goalId===gid&&e.status==='running');
const TRD={better:['↑','var(--good)','besser'],worse:['↓','var(--bad)','schlechter'],flat:['→','var(--mute)','unverändert'],none:['·','var(--mute)','noch zu wenig Messwerte'],stale:['·','var(--mute)','kein aktueller Messwert']};

const EXP_ST={running:['Läuft','var(--acc2)'],success:['Hat gewirkt','var(--good)'],fail:['Nicht bestätigt','var(--bad)'],adopted:['Trotzdem übernommen','var(--gold)'],replaced:['Ersetzt','var(--mute)']};

function loopNow(c){const {S}=c;const L=S.life,now=nowMinOf(c);const gm=goalMs(S);
 return LC.loopStage({hasGoal:activeGoals(S).length>0,openToday:gm.filter(x=>!isDone(S,x.m)&&weekLeft(S,x)>0).length,doneToday:gm.filter(x=>isDone(S,x.m)).length,reviewDue:LC.reviewWeek(L)!=null,dailyDone:!!reviewToday(S),evening:now>=1080})}

function MChart({g,ms,h=96}){const vs=ms.map(x=>x.v),t=g.metric.target;const all=t!=null?[...vs,t]:vs;let lo=Math.min(...all),hi=Math.max(...all);if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
 const W=300,X=i=>vs.length<2?W/2:8+i*(W-16)/(vs.length-1),Y=v=>h-6-(v-lo)/(hi-lo)*(h-12);const pts=vs.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
 return html`<svg viewBox=${`0 0 ${W} ${h}`} className="w-full block" style=${{height:h}} role="img" aria-label=${`Verlauf ${g.metric.name}: ${vs.length} Messwerte, zuletzt ${LC.fmtV(g.metric,vs[vs.length-1])}`}>

 <polyline points=${pts} fill="none" stroke="var(--acc2)" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>${vs.map((v,i)=>html`<circle key=${i} cx=${X(i)} cy=${Y(v)} r=${i===vs.length-1?4:2.5} fill="var(--acc2)"/>`)}</svg>`}

/* ───── Wurzel: Anmeldung → Onboarding → App ───── */
function Root(){
 const [A,setA]=useState(loadAuth);const [ready,setReady]=useState(false);const [authError,setAuthError]=useState('');const [boot,setBoot]=useState({init:null,key:0});
 const set=useCallback(fn=>setA(p=>{const n={...p,...fn(p)};saveAuth(n);return n}),[]);
 useEffect(()=>{let active=true;
 const apply=({session,recovery})=>{if(!active)return;setBoot(b=>({init:null,key:b.key+1}));setA(p=>{const next={...p,session:session||(p.session?.mode==='guest'?p.session:null),recovery:!!recovery,onboarded:session?!!localStorage.getItem(ACC_KEY+'_'+session.id):false,ob:session?.id===p.session?.id?p.ob:null};if(session?.id===p.session?.id)next.onboarded=p.onboarded;saveAuth(next);return next});setReady(true)};
 const unsub=authApi.subscribe(apply);authApi.restore().then(apply).catch(e=>{if(active){setAuthError(e.message);setReady(true)}});return()=>{active=false;unsub()};},[]);
 const skey=A.session&&A.session.mode!=='guest'?ACC_KEY+'_'+A.session.id:GUEST_KEY;
 const theme=(()=>{try{const st=JSON.parse(localStorage.getItem(skey)||'{}');window.__wwSkin=st.skin||'antik';return st.theme||'dark'}catch(e){return'dark'}})();
 if(!ready)return html`<${Shell} theme=${theme}><div className="p-6">Anmeldung wird geladen …</div><//>`;
 if(A.recovery||!A.session)return html`<div>${authError&&html`<div role="status" className="p-3 text-sm">${authError}</div>`}<${AuthFlow} A=${A} set=${set} theme=${theme}/></div>`;
 const isG=A.session.mode==='guest';
 if(isG?A.guestOb:!A.onboarded)return html`<${Onboarding} A=${A} set=${set} theme=${theme} onDone=${ob=>{const s=buildState(ob,A.session);try{localStorage.setItem(skey,JSON.stringify(s))}catch(e){}setBoot(b=>({init:s,key:b.key+1}));set(()=>(isG?{guestOb:false,ob:null}:{onboarded:true,ob:null}))}}/>`;
 if(authError&&A.session)return html`<div role="alert">${authError}<button onClick=${()=>setAuthError('')}>Zurück</button></div>`;
 const auth={session:A.session,
  signOut:async()=>{try{if(!isG)await authApi.signOut()}catch(e){setAuthError(e.message);return}setBoot(b=>({init:null,key:b.key+1}));set(()=>({session:null}))},
  restartOnboarding:()=>set(p=>({...(isG?{guestOb:true}:{onboarded:false}),ob:newOb(isG?'':(p.session&&p.session.name)||'')})),
  rename:name=>set(p=>({session:{...p.session,name},account:p.account&&p.session&&p.session.mode==='demo'?{...p.account,name}:p.account})),
  wipe:async()=>{try{if(!isG)await authApi.signOut()}catch(e){setAuthError(e.message);return}try{[skey,AUTH_KEY].forEach(k=>localStorage.removeItem(k))}catch(e){}setBoot(b=>({init:null,key:b.key+1}));setA({session:null,account:null,onboarded:false,ob:null})}};
 return html`<${App} key=${skey+boot.key} skey=${skey} init=${boot.init} auth=${auth}/>`}
