function calcBonus(k,v,S){
 if(k==='lift'){const e=epley(v.w,v.r),ver=S.stats.bench.ver,rel=(e-ver)/ver*100;return{bonus:clamp(Math.round(rel),0,20),label:`Qualität ${rel>=0?'+':''}${n1(rel)} % zur Baseline`}}
 if(k==='run'){const lp=S.stats.run5k.last/5,p=(v.mn*60+v.sc)/v.dk,rel=(lp-p)/lp*100;return{bonus:v.dk>=3?clamp(Math.round(rel*2),0,20):0,label:`Tempo ${rel>=0?'+':''}${n1(rel)} % vs. letzter 5 km`}}
 if(k==='focus')return{bonus:clamp(Math.round((v.min/60-1)*100),-50,20),label:`Dauer ${v.min} Min. (Ziel 60)`};
 if(k==='study'||k==='read')return{bonus:clamp(Math.round((v.min/20-1)*100),-50,20),label:`Dauer ${v.min} Min. (Ziel 20)`};
 if(k==='save')return{bonus:clamp(Math.round((v.amt/10-1)*100),-50,20),label:`Betrag ${eur(v.amt)} (Ziel €10)`};
 return{bonus:0,label:'Eintrag ohne Missionspunkte'}}
const LOGDEF={lift:{w:70,r:10,ver:false},squat:{w:90,r:5,ver:false},run:{dk:5,mn:23,sc:50},swim:{sd:100,mn:2,sc:4},pull:{reps:12},focus:{min:60},study:{min:20},read:{min:20},save:{amt:10}};
const LOGNAME={lift:'Bankdrücken',squat:'Kniebeuge',run:'Lauf',swim:'Schwimmen',pull:'Klimmzüge',focus:'Fokuszeit',study:'Lernzeit',read:'Lesezeit',save:'Sparen'};

 const {S}=c,k=sh.kind;
 const [v,setV]=useState(()=>{const d={...LOGDEF[k]};if(k==='lift'&&S.stats.bench.sess[0]){d.w=S.stats.bench.sess[0].w;d.r=S.stats.bench.sess[0].r}if(k==='run'){d.mn=Math.floor(S.stats.run5k.last/60);d.sc=S.stats.run5k.last%60}return d});
 const set=p=>setV(o=>({...o,...p}));
 const [q,setQ]=useState(75);
 const m=sh.mid?S.missions.find(x=>x.id===sh.mid):null;
 const {bonus,label}=calcBonus(k,v,S);
 const est=epley(v.w||0,v.r||1);
 const tot=(v.mn||0)*60+(v.sc||0);
 let body=null;
 if(k==='lift'||k==='squat'){const ver=k==='lift'?S.stats.bench.ver:S.stats.squat.ver;
  body=html`<${Step} label="Gewicht" v=${v.w} on=${x=>set({w:x})} step=${2.5} min=${20} max=${400} unit="kg" fmt=${x=>String(x).replace('.',',')}/><${Step} label="Wiederholungen" v=${v.r} on=${x=>set({r:x,ver:x===1?v.ver:false})} min=${1} max=${30}/>
  <div className="card2 p-3.5 mt-2"><div className="lbl">Geschätzter 1RM (Epley)</div><div className="num text-[28px] font-bold mt-1">${n1(est)} kg</div>
   <div className="text-[11.5px] mute mt-1.5 leading-relaxed">Verifizierter PR: <b className="num">${ver} kg</b>. Eine Schätzung ersetzt ihn nie automatisch.</div></div>
  ${v.r===1&&html`<button onClick=${()=>set({ver:!v.ver})} className="ghost w-full mt-2 p-3 flex items-center gap-3 text-left text-[12.5px]"><div className="w-5 h-5 rounded-md flex items-center justify-center" style=${{background:v.ver?'var(--acc)':'transparent',border:'1.5px solid var(--acc)'}}>${v.ver&&html`<${Icon} n="check" s=${13} sw=${3} cls="text-white"/>`}</div>Als verifizierten Rekordversuch melden (sauber, mit Zeugen oder Video)</button>`}`}
 if(k==='run')body=html`<${Step} label="Distanz" v=${v.dk} on=${x=>set({dk:x})} step=${.5} min=${.5} max=${60} unit="km" fmt=${x=>String(x).replace('.',',')}/><${Step} label="Minuten" v=${v.mn} on=${x=>set({mn:x})} min=${1} max=${600}/><${Step} label="Sekunden" v=${v.sc} on=${x=>set({sc:x})} step=${5} max=${55}/>
  <div className="card2 p-3.5 mt-2 grid grid-cols-2 gap-3"><div><div className="lbl">Pace</div><div className="num text-[22px] font-bold">${fmtT(tot/v.dk)}/km</div></div><div><div className="lbl">Ø-Tempo</div><div className="num text-[22px] font-bold">${n1(v.dk/(tot/3600))} km/h</div></div>
  <div className="col-span-2 text-[11.5px] mute">${v.dk===5?`5-km-Bestzeit: ${fmtT(S.stats.run5k.pr)}${tot<S.stats.run5k.pr?' — das wäre ein neuer Rekord!':''}`:'Nur 5-km-Läufe aktualisieren die 5-km-Statistik.'}</div></div>`;
 if(k==='swim')body=html`<${Step} label="Distanz" v=${v.sd} on=${x=>set({sd:x})} step=${50} min=${25} max=${5000} unit="m"/><${Step} label="Minuten" v=${v.mn} on=${x=>set({mn:x})} max=${180}/><${Step} label="Sekunden" v=${v.sc} on=${x=>set({sc:x})} max=${59}/>
  <div className="card2 p-3.5 mt-2"><div className="lbl">Pace / 100 m</div><div className="num text-[24px] font-bold">${fmtT(tot/v.sd*100)}</div><div className="text-[11.5px] mute">${n1(v.sd/tot*3.6)} km/h · PR ${fmtT(S.stats.swim.pr)}</div></div>`;
 if(k==='pull')body=html`<${Step} label="Wiederholungen" v=${v.reps} on=${x=>set({reps:x})} min=${1} max=${100}/><div className="text-[11.5px] mute mt-2">Bisher: ${S.stats.pull.pr} Wiederholungen.</div>`;
 if(k==='focus'||k==='study'||k==='read')body=html`<${Step} label="Dauer" v=${v.min} on=${x=>set({min:x})} step=${k==='focus'?15:5} min=${5} max=${600} unit="Min."/><div className="card2 p-3.5 mt-2 text-[12.5px]"><span className="num font-bold">${n1(v.min/60)} h</span> werden ${k==='focus'?'deiner Fokuszeit':k==='study'?'deiner Lernzeit':'deiner Lesezeit'} hinzugefügt.${k==='study'?html` Gesamt: <b className="num">${n1(S.study.hours+v.min/60)} h</b>`:''}</div>`;
 if(k==='save')body=html`<${Step} label="Betrag" v=${v.amt} on=${x=>set({amt:x})} step=${5} min=${5} max=${5000} unit="€"/><div className="card2 p-3.5 mt-2 text-[12.5px]">Neu gespart: <b className="num">${eur(S.save.saved+v.amt)}</b> · Prognose Saisonende: <b className="num">${eur(S.save.saved+v.amt+S.save.weekly*(3-c.D.week))}</b></div>`;
 const pts=m?Math.round(m.pts*(1+bonus/100)):0;
 return html`<div><div className="flex items-start justify-between"><div><div className="lbl acc">${sh.rec?'Leistung erfassen':'Schnelleingabe'}</div><h2 className="text-xl font-bold mt-1">${LOGNAME[k]}</h2>${m&&html`<div className="text-xs mute mt-1">${m.title}</div>`}</div><button onClick=${c.closeSheet} className="ghost w-9 h-9 flex items-center justify-center"><${Icon} n="x" s=${16}/></button></div>
 <div className="mt-3">${body}</div>
 ${m&&html`<div className="flex items-center justify-between mt-3 text-[12px]"><span className="mute">${label}</span><span className="num font-bold acc">+${pts} Pkt.</span></div>`}
 ${m&&html`<div className="mt-4"><${QSlider} q=${q} setQ=${setQ} m=${m} c=${c}/></div>`}
 <button className="btn w-full py-3.5 mt-4 text-sm" onClick=${()=>c.logSave(k,v,sh.mid,false,m?q:undefined)}>${m?'Speichern & Mission abschließen':'Speichern'}</button></div>`}

 const e=k=>tried?E[k]:'';

  try{const r=await authApi.signUp({name:f.name.trim(),email:f.email.trim(),password:f.pw});const user={name:r.user.name,email:r.user.email};set(()=>({account:user,session:{mode:'demo',...user},onboarded:false,ob:newOb(user.name)}))}catch(x){setErr(x.message)}setBusy(false)};
 const login=async ev=>{ev.preventDefault();setTried(true);if(E.email||E.pw)return;setBusy(true);setErr('');
  try{const r=await authApi.signIn({email:f.email,password:f.pw},A.account);set(p=>({session:{mode:'demo',...r.user},ob:p.onboarded?null:(p.ob||newOb(r.user.name))}))}catch(x){setErr(x.message)}setBusy(false)};
 const forgot=async ev=>{ev.preventDefault();setTried(true);if(E.email)return;await authApi.resetPassword(f.email);setMsg('Demo-Modus: Es wurde keine E-Mail verschickt. Sobald echte Konten (Supabase) aktiv sind, bekommst du hier einen Link zum Zurücksetzen.')};
 const guest=()=>set(()=>({session:{mode:'guest',name:'Gast'}}));
 const Back=html`<button type="button" aria-label="Zurück" onClick=${()=>go(v==='forgot'?'login':'welcome')} className="ghost w-10 h-10 flex items-center justify-center mb-5"><${Icon} n="chevL" s=${20}/></button>`;
 if(v==='welcome')return html`<${Shell} theme=${theme}><div className="flex-1 flex flex-col px-6 relative screen" style=${{paddingTop:'max(28px,env(safe-area-inset-top))',paddingBottom:'max(24px,env(safe-area-inset-bottom))'}}>

   <div className="mt-8"><div className="text-[11px] tracking-[.32em] mute font-semibold">THE</div><div className="disp text-[52px] tracking-[.02em]">War Within</div></div>
   <p className="disp disp-i text-[22px] mt-4 max-w-[300px]" style=${{color:'var(--acc2)',textTransform:'none'}}>Werde, wer du sein kannst.</p></div>
  <div className="flex flex-col gap-2.5">
   <button onClick=${()=>go('signup')} className="btn w-full py-4 text-[15px]">Registrieren</button>

 if(v==='signup')return html`<${Shell} theme=${theme}><form noValidate onSubmit=${signup} className="flex-1 overflow-y-auto px-6 relative screen" style=${{paddingTop:'max(20px,env(safe-area-inset-top))',paddingBottom:32}}>${Back}
  <div className="disp text-[38px]">Konto erstellen</div><div className="text-[13.5px] mute mt-1.5 mb-6">Ein Konto, eine Reise. Dauert 20 Sekunden.</div>
  <${Field} id="su-name" label="Anzeigename" value=${f.name} on=${F('name')} err=${e('name')} auto="nickname" max=${40}/>

  ${err&&html`<div role="alert" className="text-[12.5px] mb-3" style=${{color:'var(--bad)'}}>${err}</div>`}
  <button type="submit" disabled=${busy} className="btn w-full py-4 text-[15px] mt-1">Konto erstellen</button>

 if(v==='login')return html`<${Shell} theme=${theme}><form noValidate onSubmit=${login} className="flex-1 overflow-y-auto px-6 relative screen" style=${{paddingTop:'max(20px,env(safe-area-inset-top))',paddingBottom:32}}>${Back}

 return html`<${Shell} theme=${theme}><form noValidate onSubmit=${forgot} className="flex-1 overflow-y-auto px-6 relative screen" style=${{paddingTop:'max(20px,env(safe-area-inset-top))',paddingBottom:32}}>${Back}

   <div className="flex-1 flex gap-1" role="progressbar" aria-label="Fortschritt" aria-valuemin="1" aria-valuemax=${OB_N} aria-valuenow=${st+1}>${Array.from({length:OB_N}).map((_,i)=>html`<div key=${i} className="flex-1 h-1.5 rounded-full overflow-hidden" style=${{background:'var(--ghost)'}}><div className="h-full rounded-full" style=${{width:i<=st?'100%':'0%',background:'linear-gradient(90deg,#A78BFA,#7C3AED)',transition:'width .4s ease'}}/></div>`)}</div>

 const skey=A.session&&A.session.mode!=='guest'?ACC_KEY:GUEST_KEY;
 const theme=(()=>{try{return(JSON.parse(localStorage.getItem(skey)||'{}').theme)||'dark'}catch(e){return'dark'}})();
 if(!A.session)return html`<${AuthFlow} A=${A} set=${set} theme=${theme}/>`;

 const simChal=id=>{const x=S.challenges.find(k=>k.id===id);const [inv,base,f]=METRICS[x.metric]||[false,()=>100,v=>v];const b=base(S);let r;

 /* Tageswechsel */
 const advance=()=>{const idle=S.streak>0&&todayTotal(S)===0&&!S.rest.includes(S.day);upd(n=>{
